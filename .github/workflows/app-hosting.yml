name: Firebase App Hosting

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/app-hosting.yml"
      - "firebase.json"
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/app-hosting.yml"
      - "firebase.json"
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

jobs:
  build-and-deploy:
    name: Build & Deploy App Hosting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Select site target
        id: site
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "SITE_ID=${{ secrets.FIREBASE_APPHOSTING_SITE_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "BRANCH=${GITHUB_HEAD_REF}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "SITE_ID=${{ secrets.FIREBASE_APPHOSTING_SITE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "BRANCH=main" >> "$GITHUB_OUTPUT"
          else
            echo "SITE_ID=${{ secrets.FIREBASE_APPHOSTING_SITE_STAGING }}" >> "$GITHUB_OUTPUT"
            echo "BRANCH=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Firebase App Hosting
        env:
          SITE_ID: ${{ steps.site.outputs.SITE_ID }}
          BRANCH: ${{ steps.site.outputs.BRANCH }}
        run: |
          firebase apphosting:sites:deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --site "$SITE_ID" \
            --branch "$BRANCH" \
            --config ../firebase.json \
            --json \
            --quiet
