name: Cleanup Preview Environment

on:
  pull_request:
    types: [closed]

# Cancel any in-progress cleanup runs for the same PR
concurrency:
  group: cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-backend-preview:
    name: Delete Backend Preview Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      REGION: asia-northeast1
      PREVIEW_PREFIX: ledger-muse-api-pr-
      ARTIFACT_REPOSITORY: ledger-muse
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Delete Cloud Run preview service
        id: delete
        run: |
          SERVICE_NAME="${PREVIEW_PREFIX}${{ github.event.pull_request.number }}"
          echo "Checking for preview service: $SERVICE_NAME"

          if gcloud run services describe "$SERVICE_NAME" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format="get(metadata.name)" 2>/dev/null; then

            echo "Deleting preview service: $SERVICE_NAME"
            gcloud run services delete "$SERVICE_NAME" \
              --region "${{ env.REGION }}" \
              --project "${{ env.PROJECT_ID }}" \
              --quiet

            echo "status=deleted" >> "$GITHUB_OUTPUT"
            echo "service=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Preview service not found: $SERVICE_NAME"
            echo "status=not_found" >> "$GITHUB_OUTPUT"
            echo "service=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Artifact Registry images
        if: steps.delete.outputs.status == 'deleted'
        run: |
          set -euo pipefail
          SERVICE_NAME="${PREVIEW_PREFIX}${{ github.event.pull_request.number }}"
          REPOSITORY_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}"

          echo "Searching for image digests under ${REPOSITORY_PATH}/${SERVICE_NAME}"
          mapfile -t DIGESTS < <(gcloud artifacts docker images list "${REPOSITORY_PATH}" \
            --filter="package:${SERVICE_NAME}" \
            --format="value(artifactUri)" 2>/dev/null || true)

          if [ ${#DIGESTS[@]} -eq 0 ]; then
            echo "No images found for ${SERVICE_NAME}"
            exit 0
          fi

          for URI in "${DIGESTS[@]}"; do
            echo "Deleting image ${URI}"
            gcloud artifacts docker images delete "${URI}" \
              --delete-tags \
              --quiet || echo "Image ${URI} already deleted"
          done

      - name: Comment cleanup status
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          identifier: backend-preview-cleanup
          body: |
            ### 🧹 Preview Environment Cleaned Up

            **Service**: ${{ steps.delete.outputs.service }}
            **Status**: ${{ steps.delete.outputs.status == 'deleted' && '✓ Deleted successfully' || '⚠️ Not found (may have been already deleted)' }}

            Preview environment resources have been removed.
