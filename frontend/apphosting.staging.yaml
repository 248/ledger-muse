# Firebase App Hosting configuration for staging
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # CPU and memory configuration
  cpu: 1
  memoryMiB: 512
  # Minimum instances to keep warm (0 for cost optimization)
  minInstances: 0
  # Maximum instances for scaling
  maxInstances: 1
  # Concurrency - number of concurrent requests per instance
  concurrency: 80

env:
  # Staging backend API base URL - loaded from Secret Manager
  # Using project number format (required by App Hosting): projects/PROJECT_NUMBER/secrets/SECRET_ID/versions/VERSION
  - variable: NEXT_PUBLIC_BACKEND_API_BASE
    secret: projects/912371481714/secrets/BACKEND_API_BASE_STAGING/versions/latest
    availability:
      - BUILD
      - RUNTIME
